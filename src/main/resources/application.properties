spring.application.name=projeto-amar
spring.profiles.default=dev
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

jwt.validity=${JWT_VALIDITY}
jwt.secret=${JWT_SECRET}
security.pepper=${SECURITY_PEPPER}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.6-flash}

app.email.remetente=${MAIL_FROM}
app.recuperacao-senha.url=${PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMTP separado para os alertas. MAIL_* continua sendo usado pela recuperação de senha.
alert.mail.host=${ALERT_MAIL_HOST:smtp.gmail.com}
alert.mail.port=${ALERT_MAIL_PORT:587}
alert.mail.username=${ALERT_MAIL_USERNAME:}
alert.mail.password=${ALERT_MAIL_PASSWORD:}
alert.mail.from=${ALERT_MAIL_FROM:}
app.notificacoes.risco-vencimento-cron=${ALERTS_EXPIRY_CRON:0 0 8 * * *}
app.notificacoes.time-zone=${ALERTS_TIME_ZONE:America/Sao_Paulo}

spring.ai.mcp.server.name=amar-relatorio
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.enabled=false

# O bootstrap é intencionalmente desligado. Quando necessário, todos os valores
# devem ser injetados pelo ambiente ou por um gerenciador de segredos.
security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
security.bootstrap-admin.nome=${BOOTSTRAP_ADMIN_NOME}
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL}
security.bootstrap-admin.senha=${BOOTSTRAP_ADMIN_SENHA}
