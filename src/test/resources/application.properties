spring.application.name=projeto-amar-test

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# JWT config for tests
jwt.validity=3600
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHktMTIzNDU2Nzg=
security.pepper=test-pepper-value

app.email.remetente=teste@projetoamar.com
app.recuperacao-senha.url=http://localhost:5173/redefinir-senha
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
alert.mail.host=localhost
alert.mail.port=2525
alert.mail.username=teste
alert.mail.password=teste
alert.mail.from=alertas@projetoamar.com
app.notificacoes.risco-vencimento-cron=-

security.cors.allowed-origins=http://localhost:3000,http://localhost:5173
security.cookie.secure=false
security.cookie.max-age-seconds=3600
security.csrf.enabled=true
security.transport.require-https=false
